name: CacheCAD application pipeline
"on":
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SOURCE_DATE_EPOCH: '1792324800'
      PYTHONDONTWRITEBYTECODE: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      # Verified official tag refs with git ls-remote on 2026-10-18.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.14'
      - name: Install hash-locked Linux tools
        run: |
          python -m pip install --index-url https://pypi.org/simple --only-binary=:all: --require-hashes -r requirements/linux-build.lock
      - name: Validate manifests and run offline tests and lint
        run: |
          python tooling/check.py --ruff --require-recovery-manifest --require-maintained-manifest
      - name: Assemble verified application source
        run: |
          python tooling/assemble_app.py app-source
      - name: Build source archive and wheel
        run: |
          python -m build --no-isolation
      - name: Validate wheel in clean environment
        run: |
          python tooling/validate_wheel.py dist/cachecad_reconstructed-0.1.0-py3-none-any.whl
      # No secrets, original binaries, cloud accounts, deploy, or artifact upload.
  offline-qt:
    needs: offline
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Install Ubuntu Qt shared-library prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libopengl0
      - name: Install hash-locked Qt and Google SDK runtime
        run: |
          python -m pip install --index-url https://pypi.org/simple --only-binary=:all: --require-hashes -r requirements/runtime-linux.lock
      - name: Exercise actual application and isolated regression fixtures
        run: |
          export CACHECAD_RUNTIME_PYTHON="$(command -v python)"
          python -m unittest discover -s tests -p test_offline_runtime.py -v
          python -m unittest discover -s tests -p test_desktop_signin.py -v
          python -m unittest discover -s tests -p test_signin_security_review.py -v
          python -m unittest discover -s tests -p test_signin_gui_runtime.py -v
          python -m unittest discover -s tests -p test_google_session.py -v
          python -m unittest discover -s tests -p test_windows_token_store.py -v
          python -m unittest discover -s tests -p test_profile_lock.py -v
          python -m unittest discover -s tests -p test_production_auth_review.py -v
          python -m unittest discover -s tests -p test_application_auth_runtime.py -v
          python -m unittest discover -s tests -p test_destructive_confirmation.py -v
          python -m unittest discover -s tests -p "test_file_identity*.py" -v
          python -m unittest discover -s tests -p "test_transfer_recovery*.py" -v
          python -m unittest discover -s tests -p test_transfer_journal.py -v
          python -m unittest discover -s tests -p test_transfer_results_ui.py -v
          python -m unittest discover -s tests -p test_sync_history_recovery.py -v
          python -m unittest discover -s tests -p test_remote_refresh_audit.py -v
          python -m unittest discover -s tests -p test_crash_diagnostics.py -v
          python -m unittest discover -s tests -p "test_application_updates*.py" -v
          python -m unittest discover -s tests -p test_windows_update_install.py -v
          python -m unittest discover -s tests -p test_update_safety_review.py -v
          python -m unittest discover -s tests -p test_update_lifecycle.py -v

  windows-installer:
    needs: [offline, offline-qt]
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      SOURCE_DATE_EPOCH: '1792324800'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
          architecture: x64
      - name: Install hash-locked Windows application and packaging tools
        run: |
          python -m venv .venv-windows
          .\.venv-windows\Scripts\python.exe -m pip install --index-url https://pypi.org/simple --only-binary=:all: --require-hashes -r requirements/runtime-windows.lock -r requirements/windows-build.lock
          "$env:GITHUB_WORKSPACE\.venv-windows\Scripts" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Verify Google session and native DPAPI without real credentials
        run: |
          $env:CACHECAD_RUNTIME_PYTHON = (Get-Command python).Source
          python -m unittest discover -s tests -p test_google_session.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p test_windows_token_store.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p test_profile_lock.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p test_upgrade_profile.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p test_desktop_signin.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p test_signin_security_review.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p test_production_auth_review.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p test_application_auth_runtime.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p test_destructive_confirmation.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p "test_file_identity*.py" -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p "test_transfer_recovery*.py" -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p test_transfer_journal.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p test_transfer_results_ui.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p test_sync_history_recovery.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p test_remote_refresh_audit.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p test_crash_diagnostics.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p "test_application_updates*.py" -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p test_windows_update_install.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p test_update_safety_review.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p test_update_lifecycle.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build actual maintained application and per-user installer
        run: |
          python packaging/windows/build.py --output dist/windows
      - name: Build isolated prior-version upgrade fixture
        run: |
          python tooling/version.py --previous-fixture dist/upgrade-version.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python packaging/windows/build.py --output dist/windows-previous --version-file dist/upgrade-version.json
      - name: Install and exercise installed application on Windows
        run: |
          python packaging/windows/test_installer.py --installer dist/windows/installer/CacheCAD-Setup.exe --report-dir dist/windows/test-results
      - name: Prove native N-to-N-plus-1 upgrade and preserved user data
        run: |
          python packaging/windows/test_upgrade.py --older-installer dist/windows-previous/installer/CacheCAD-Setup.exe --newer-installer dist/windows/installer/CacheCAD-Setup.exe --report-dir dist/windows/upgrade-results
      - name: Upload tested Windows application installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: CacheCAD-Windows-Application-${{ github.sha }}
          path: |
            dist/windows/installer/*.exe
            dist/windows/installer.sha256
            dist/windows/build-provenance.json
            dist/windows/test-results/*.json
            dist/windows/upgrade-results/*.json
            docs/WINDOWS_TRYOUT.md
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Upload diagnostic logs when Windows validation fails
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: CacheCAD-Windows-Diagnostics-${{ github.sha }}
          path: |
            dist/windows/test-results/*.json
            dist/windows/upgrade-results/*.json
            dist/windows/test-results/*.log
            dist/windows/upgrade-results/*.log
            dist/windows-previous/build-logs/*.log
            dist/windows-previous/build-provenance.json
            dist/windows/build-logs/*.log
            dist/windows/build-provenance.json
          if-no-files-found: ignore
          retention-days: 7

  macos-application:
    needs: [offline, offline-qt]
    runs-on: macos-15
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      SOURCE_DATE_EPOCH: '1792324800'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
          architecture: arm64
      - name: Install hash-locked Apple Silicon runtime and build tools
        run: |
          test "$(uname -m)" = arm64
          python -m pip install --index-url https://pypi.org/simple --only-binary=:all: --require-hashes -r requirements/runtime-macos.lock -r requirements/macos-build.lock
          python -m pip check
      - name: Verify actual macOS platform contracts and isolated session storage
        env:
          CACHECAD_TEST_MACOS_KEYCHAIN: '1'
        run: |
          python -m unittest discover -s tests -p test_macos_application.py -v
          python -m unittest discover -s tests -p test_crossplatform_drive_paths.py -v
          python -m unittest discover -s tests -p test_macos_token_store.py -v
          python -m unittest discover -s tests -p test_profile_lock.py -v
          python -m unittest discover -s tests -p test_google_session.py -v
      - name: Build real arm64 application bundle
        run: |
          python packaging/macos/build.py --output dist/macos
      - name: Extract and launch distributed app with native Cocoa window
        run: |
          python packaging/macos/test_app.py --archive dist/macos/CacheCAD-macOS-arm64.zip --report-dir dist/macos/test-results
      - name: Upload verified Apple Silicon application
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: CacheCAD-macOS-arm64-${{ github.sha }}
          path: |
            dist/macos/CacheCAD-macOS-arm64.zip
            dist/macos/archive.sha256
            dist/macos/build-provenance.json
            dist/macos/test-results/*.json
            packaging/macos/README.md
          if-no-files-found: error
          retention-days: 14
      - name: Upload bounded Mac failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: CacheCAD-macOS-Diagnostics-${{ github.sha }}
          path: |
            dist/macos/build-logs/*.log
            dist/macos/build-provenance.json
            dist/macos/test-results/*.json
            dist/macos/test-results/*.log
          if-no-files-found: ignore
          retention-days: 7

  linux-application:
    needs: [offline, offline-qt]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      SOURCE_DATE_EPOCH: '1792324800'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
          architecture: x64
      - name: Install Linux GUI prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb xauth libegl1 libgl1 libopengl0 libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0
      - name: Install hash-locked application and packaging tools
        run: |
          python -m pip install --index-url https://pypi.org/simple --only-binary=:all: --require-hashes -r requirements/runtime-linux.lock -r requirements/linux-package.lock
          python -m pip check
      - name: Build actual Linux application distribution
        run: |
          python packaging/linux/build.py --output dist/linux-application
      - name: Install extracted distribution and exercise real X11 window
        run: |
          xvfb-run -a -s '-screen 0 1280x900x24' python packaging/linux/test_app.py --archive dist/linux-application/CacheCAD-Linux-x86_64.tar.gz --report-dir dist/linux-application/test-results
      - name: Upload verified Linux application
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: CacheCAD-Linux-x86_64-${{ github.sha }}
          path: |
            dist/linux-application/CacheCAD-Linux-x86_64.tar.gz
            dist/linux-application/archive.sha256
            dist/linux-application/build-provenance.json
            dist/linux-application/test-results/*.json
            dist/linux-application/test-results/*.png
            packaging/linux/README.md
          if-no-files-found: error
          retention-days: 14
      - name: Upload bounded Linux failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: CacheCAD-Linux-Diagnostics-${{ github.sha }}
          path: |
            dist/linux-application/build-logs/*.log
            dist/linux-application/build-provenance.json
            dist/linux-application/test-results/*.json
            dist/linux-application/test-results/*.log
          if-no-files-found: ignore
          retention-days: 7
