name: Permafrost desktop
on:
  push:
    branches: [main, "codex/**"]
    tags: ["v2.*"]
    paths-ignore: ["recovered/**", "maintained/**", "src/**", "requirements/**"]
  pull_request:
    paths-ignore: ["recovered/**", "maintained/**", "src/**", "requirements/**"]
  workflow_dispatch:
    inputs:
      core_test_filter:
        description: "Run one core chaos regression without rebuilding installers"
        type: string
        required: false
        default: ""
      core_test_platform:
        description: "Native platform for the focused core regression"
        type: choice
        options: [windows-latest, macos-14, macos-15-intel, ubuntu-latest]
        default: windows-latest
      installer_run_id:
        description: "Verify an existing installer from this CI run (no rebuild)"
        type: string
        required: false
        default: ""
      installer_platform:
        description: "Platform of the existing installer to verify"
        type: choice
        options: [macos-intel, windows-x64]
        default: macos-intel
      diagnostic_source_build:
        description: "Build a debug installer on an Intel Mac first"
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.ref }}${{ inputs.installer_run_id && '-diagnostics' || inputs.core_test_filter && '-core-diagnostics' || '' }}
  # Let native compiles finish and populate caches; keep only the latest queued run.
  cancel-in-progress: false
jobs:
  core-diagnostics:
    if: github.event_name == 'workflow_dispatch' && inputs.core_test_filter != ''
    name: Focused core chaos regression
    runs-on: ${{ inputs.core_test_platform }}
    env:
      PERMAFROST_CORE_TEST_FILTER: ${{ inputs.core_test_filter }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - shell: bash
        run: cargo test -p permafrost-core --locked "$PERMAFROST_CORE_TEST_FILTER" -- --nocapture
  web:
    if: ${{ !inputs.installer_run_id && !inputs.core_test_filter }}
    name: Interface and file actions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: python -m unittest discover -s tooling/tauri -p 'test_*.py' -v
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Permafrost-Interface-Test-Reports
          path: |
            test-results/
            desktop/playwright-report/
  native:
    if: ${{ !inputs.installer_run_id && !inputs.core_test_filter }}
    name: Installer · ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS Apple Silicon
            os: macos-14
            target: aarch64-apple-darwin
            download: macos-arm64
            label: macOS-Apple-Silicon
            bundles: app,dmg
          - platform: macOS Intel
            os: macos-15-intel
            target: x86_64-apple-darwin
            download: macos-x64
            label: macOS-Intel
            bundles: app,dmg
          - platform: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            download: windows-x64
            label: Windows-x64
            bundles: nsis
    runs-on: ${{ matrix.os }}
    env:
      PERMAFROST_GOOGLE_CLIENT_ID: ${{ vars.PERMAFROST_GOOGLE_CLIENT_ID }}
      PERMAFROST_GOOGLE_CLIENT_SECRET: ${{ secrets.PERMAFROST_GOOGLE_CLIENT_SECRET }}
      PERMAFROST_UPDATER_PUBLIC_KEY: ${{ vars.PERMAFROST_UPDATER_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: rustfmt,clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: cargo fmt --all -- --check
      - name: Match the Mac deployment target across tests, installers, and upgrade fixtures
        if: runner.os == 'macOS'
        run: echo "MACOSX_DEPLOYMENT_TARGET=12.0" >> "$GITHUB_ENV"
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Verify stable local signing across rebuilds and the development runner
        if: runner.os == 'macOS'
        run: |
          npm run desktop:setup-signing
          npm run desktop:verify-signing
      - name: Verify login-Keychain access across rebuilt authenticated callers
        if: runner.os == 'macOS'
        run: npm run desktop:verify-keychain
      - run: node tooling/tauri/configure-release.mjs
      - run: npm run tauri -- build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
      - name: Install, verify shortcuts and workspace, reveal local file, uninstall
        run: python tooling/tauri/verify_installer.py --bundle target/${{ matrix.target }}/release/bundle --output installer-evidence
      - name: Reject tampering and upgrade an installed app between two signed versions
        run: python tooling/tauri/verify_upgrade.py --debug --output upgrade-evidence
      - name: Prepare clearly named installer download
        id: download
        run: python tooling/tauri/prepare_download.py --bundle target/${{ matrix.target }}/release/bundle --platform ${{ matrix.download }} --output installer-download
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.download.outputs.artifact_name }}
          path: installer-download/
          if-no-files-found: error
          compression-level: 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Permafrost-${{ matrix.label }}-Test-Reports
          path: |
            installer-evidence/
            upgrade-evidence/
  installer-diagnostics-build:
    name: Build debug installer on Intel Mac
    if: github.event_name == 'workflow_dispatch' && inputs.installer_run_id != '' && inputs.installer_platform == 'macos-intel' && inputs.diagnostic_source_build
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npm run tauri -- build --debug --target x86_64-apple-darwin --bundles app,dmg --ci
      - uses: actions/upload-artifact@v4
        with:
          name: Permafrost-Debug-macOS-Intel-Installer
          path: target/x86_64-apple-darwin/debug/bundle/dmg/*.dmg
  installer-diagnostics:
    name: Reproduce existing Intel installer
    needs: installer-diagnostics-build
    if: always() && github.event_name == 'workflow_dispatch' && inputs.installer_run_id != '' && inputs.installer_platform == 'macos-intel' && (needs.installer-diagnostics-build.result == 'success' || needs.installer-diagnostics-build.result == 'skipped')
    runs-on: macos-15-intel
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        if: ${{ !inputs.diagnostic_source_build }}
        with:
          # Accept historical runs as well as the clearly named downloads.
          pattern: "{installer-x86_64-apple-darwin,Permafrost-*-macOS-Intel-Installer}"
          merge-multiple: true
          run-id: ${{ inputs.installer_run_id }}
          github-token: ${{ github.token }}
          path: diagnostic-bundle
      - uses: actions/download-artifact@v4
        if: inputs.diagnostic_source_build
        with:
          name: Permafrost-Debug-macOS-Intel-Installer
          path: diagnostic-bundle
      - run: python tooling/tauri/verify_installer.py --bundle diagnostic-bundle --output installer-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Permafrost-macOS-Intel-Diagnostic-Reports-${{ inputs.installer_run_id }}
          path: installer-evidence/
  windows-installer-diagnostics:
    name: Verify existing Windows installer and shortcuts
    if: github.event_name == 'workflow_dispatch' && inputs.installer_run_id != '' && inputs.installer_platform == 'windows-x64'
    runs-on: windows-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          pattern: "{installer-x86_64-pc-windows-msvc,Permafrost-*-Windows-x64-Installer}"
          merge-multiple: true
          run-id: ${{ inputs.installer_run_id }}
          github-token: ${{ github.token }}
          path: diagnostic-bundle
      - name: Prepare native NSIS shortcut diagnostics
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/tauri-apps/binary-releases/releases/download/nsis-3/nsis-3.zip -OutFile "$env:RUNNER_TEMP/nsis.zip"
          Expand-Archive "$env:RUNNER_TEMP/nsis.zip" "$env:RUNNER_TEMP/nsis"
          $compiler = (Get-ChildItem "$env:RUNNER_TEMP/nsis" -Recurse -Filter makensis.exe | Select-Object -First 1).FullName
          "PERMAFROST_NSIS_PROBE=$compiler" >> $env:GITHUB_ENV
      - run: python tooling/tauri/verify_installer.py --bundle diagnostic-bundle --output installer-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Permafrost-Windows-x64-Diagnostic-Reports-${{ inputs.installer_run_id }}
          path: installer-evidence/
  release:
    name: Signed update artifacts
    needs: [web, native]
    if: startsWith(github.ref, 'refs/tags/v2.')
    permissions:
      contents: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            bundles: app,dmg
          - os: macos-15-intel
            target: x86_64-apple-darwin
            bundles: app,dmg
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
    runs-on: ${{ matrix.os }}
    env:
      PERMAFROST_GOOGLE_CLIENT_ID: ${{ vars.PERMAFROST_GOOGLE_CLIENT_ID }}
      PERMAFROST_GOOGLE_CLIENT_SECRET: ${{ secrets.PERMAFROST_GOOGLE_CLIENT_SECRET }}
      PERMAFROST_UPDATER_PUBLIC_KEY: ${{ vars.PERMAFROST_UPDATER_PUBLIC_KEY }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: node tooling/tauri/configure-release.mjs --release
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Permafrost ${{ github.ref_name }}"
          releaseBody: "Permafrost desktop update. See the versioned release notes in the repository."
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
          includeUpdaterJson: true
          updaterJsonPreferNsis: true

      - name: Verify the signed release installer before publication
        run: python tooling/tauri/verify_installer.py --bundle target/${{ matrix.target }}/release/bundle --output installer-evidence
  publish:
    name: Publish verified update
    needs: release
    if: startsWith(github.ref, 'refs/tags/v2.')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Publish after every installer gate passes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ github.ref_name }}" --draft=false
